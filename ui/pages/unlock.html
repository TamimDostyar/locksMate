<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Unlock LocksMate</title>
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body class="window">
  <section class="center">
    <div class="mark-lg" data-icon="lock"></div>
    <h1 id="title">Unlock LocksMate</h1>
    <p id="subtitle">Touch the fingerprint sensor to open your vault.</p>
    <form id="unlock">
      <button id="submit" class="primary" type="submit"><span data-icon="key"></span><span id="label">Unlock with Touch ID</span></button>
      <p id="hint" class="hint"></p>
      <p id="error" class="error"></p>
    </form>
  </section>
  <script type="module" src="../scripts/unlock.js"></script>
</body>
</html>
