<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Unlock LocksMate</title>
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body class="window">
  <section class="center">
    <div class="mark-lg" data-icon="lock"></div>
    <h1 id="title">Unlock LocksMate</h1>
    <p id="subtitle">Enter your master password, then confirm with Touch ID.</p>
    <form id="unlock">
      <input id="code" type="text" placeholder="Setup code from terminal" autocomplete="off" hidden>
      <input id="password" type="password" placeholder="Master password" required autofocus>
      <button id="submit" class="primary" type="submit"><span data-icon="key"></span><span id="label">Unlock with Touch ID</span></button>
      <p id="error" class="error"></p>
    </form>
  </section>
  <script type="module" src="../scripts/unlock.js"></script>
</body>
</html>
